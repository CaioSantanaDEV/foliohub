# ==========================================
# 1. SERVIDOR E CONEX�O POSTGRESQL
# ==========================================
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foliohub_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Usa 'validate' para garantir integridade, pois o Flyway quem cria/modifica o schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. FLYWAY (MIGRA��ES DE BANCO)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. INTEGRA��O COM A BRAPI (API EXTERNA)
# ==========================================
# Se a aplica��o consome a Brapi via token ou chave de API:
brapi.api.url=https://brapi.dev/api
brapi.api.token=${BRAPI_TOKEN:}

# ==========================================
# 5. SEGURAN�A / JWT (Para cadastro e login)
# ==========================================
# Chave secreta de pelo menos 256 bits (32 caracteres alfanum�ricos) para assinar tokens JWT
jwt.secret=${JWT_SECRET:chave_secreta_padrao_para_ambiente_de_desenvolvimento_local_32_chars}
jwt.expiration=86400000