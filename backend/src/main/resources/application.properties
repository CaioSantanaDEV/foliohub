# ==========================================
# 1. SERVIDOR E CONEXAO POSTGRESQL
# ==========================================
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foliohub_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. FLYWAY (MIGRACOES DE BANCO)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. INTEGRACAO COM A BRAPI (API EXTERNA)
# ==========================================
foliohub.integration.brapi.base-url=https://brapi.dev/api
foliohub.integration.brapi.token=${BRAPI_TOKEN:}

# ==========================================
# 5. INTEGRACAO COM O BANCO CENTRAL (BACEN SGS)
# ==========================================
foliohub.integration.bacen.base-url=https://api.bcb.gov.br/dados/serie/bcdata.sgs

# ==========================================
# 6. SEGURANCA / JWT
# ==========================================
jwt.secret=${JWT_SECRET:chave_secreta_padrao_para_ambiente_de_desenvolvimento_local_32_chars}
jwt.expiration=86400000
