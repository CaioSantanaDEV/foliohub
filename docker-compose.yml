
services:
  postgres:
    image: postgres:16-alpine
    container_name: foliohub-postgres
    restart: always
    environment:
      POSTGRES_DB: foliohub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - foliohub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foliohub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  foliohub_pgdata:
    driver: local